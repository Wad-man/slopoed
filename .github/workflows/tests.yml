name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 на свежих образах ubuntu нет: матрица начинается с 3.10.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python tests/test_lint.py
      - name: README passes its own linter
        run: python scripts/lint.py README.md --genre article
      - name: Quality research report passes the linter
        run: python scripts/lint.py docs/quality-research.md --genre article
      - name: Docs have no mixed-script words
        run: python tools/prooftext.py --fail-on-hit
